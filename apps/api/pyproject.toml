[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "google-genai>=2.28.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.47",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Szum spoza testów: klient testowy Starlette i `on_event` w app/main.py.
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:\\s*on_event is deprecated:DeprecationWarning",
    "ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated",
]
